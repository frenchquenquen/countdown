<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>FrenchQuenQuen — 17 octobre</title>
<style>
:root{color-scheme:dark;--yellow:#ffd21f;--black:#050505;--muted:#b6b6b6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--black);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;z-index:-1;width:min(80vw,760px);aspect-ratio:1;left:50%;top:43%;transform:translate(-50%,-50%);background:radial-gradient(circle,#ffd21f18 0,transparent 68%);pointer-events:none}
main{width:min(760px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(18px,3vh,30px)}
.logo-frame{position:relative;width:min(76vw,490px);aspect-ratio:2000/1778;isolation:isolate}
.logo-frame:before{content:"";position:absolute;z-index:-1;inset:15%;border-radius:50%;background:#ffd21f12;filter:blur(34px);animation:breath 4s ease-in-out infinite}
.logo{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 28px #ffd21f22)}
.signals{position:absolute;inset:-7%;pointer-events:none}
.signal{position:absolute;left:var(--x);top:var(--y);width:13px;height:13px;background:var(--yellow);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 8px #ffd21f);opacity:0;transform:translate(-50%,-50%) scale(0);transform-origin:center}
.signal:nth-child(3n){width:9px;height:9px}
.signal:nth-child(4n){width:16px;height:16px}
.signal.visible{opacity:.9;transform:translate(-50%,-50%) scale(1);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.signal.latest{animation:arrive 1.2s cubic-bezier(.2,.8,.2,1) both}
.timer{width:min(680px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,16px);margin-top:clamp(2px,1vh,10px)}
.unit{padding:clamp(12px,3vw,20px) 6px 13px;border:1px solid #ffd21f70;border-radius:12px;background:#111;box-shadow:inset 0 -3px 0 #ffd21f}
.number{display:block;color:var(--yellow);font-size:clamp(1.8rem,7vw,3.7rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.label{display:block;margin-top:9px;color:var(--muted);font-size:clamp(.58rem,1.7vw,.76rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
main.complete .logo-frame:before{animation:breath 1.8s ease-in-out infinite}
main.complete .signal{opacity:1}
@keyframes arrive{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-90deg)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.6) rotate(12deg)}100%{opacity:.9;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes breath{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}
@media(max-width:420px){body{padding:18px}.timer{gap:6px}.unit{border-radius:9px}.label{letter-spacing:.04em}.logo-frame{width:min(82vw,430px)}}
</style>
</head>

function parisDayUtc() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const values = Object.fromEntries(parts.map(p => [p.type, p.value]));
  return Date.UTC(Number(values.year), Number(values.month) - 1, Number(values.day));
}
function updateSignals() {
  const daysElapsed = Math.floor((parisDayUtc() - startDayUtc) / 86400000);
  const revealCount = Math.min(10, Math.max(0, daysElapsed + 1));
  document.querySelectorAll('.signal').forEach((signal, index) => {
    if (index < revealCount) {
      signal.classList.add('visible');
      if (index === revealCount - 1) signal.classList.add('latest');
    }
  });
}
function update() {
  const diff = target - Date.now();
  if (diff <= 0) {
    for (const id of ['days', 'hours', 'minutes', 'seconds']) document.getElementById(id).textContent = '00';
    document.getElementById('page').classList.add('complete');
    return;
  }
  document.getElementById('days').textContent = Math.floor(diff / 86400000);
  document.getElementById('hours').textContent = pad(Math.floor(diff / 3600000) % 24);
  document.getElementById('minutes').textContent = pad(Math.floor(diff / 60000) % 60);
  document.getElementById('seconds').textContent = pad(Math.floor(diff / 1000) % 60);
  setTimeout(update, 250);
}
updateSignals();
update();
</script>
